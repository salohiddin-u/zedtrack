<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Table</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite -->
  <script src="https://unpkg.com/flowbite@2.3.0/dist/flowbite.min.js"></script>
</head>

<body class="bg-gray-100 p-10">

<div class="max-w-5xl mx-auto bg-white rounded-lg shadow">

  <!-- Search -->
  <div class="p-4">
    <input
      id="searchInput"
      type="text"
      placeholder="Search..."
      class="w-full md:w-80 p-2 border rounded-lg"
    />
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left text-gray-600">
      <thead class="bg-gray-50 text-xs uppercase table w-full table-fixed">
        <tr>
          <th class="px-6 py-3 w-1/3 cursor-pointer" data-column="0">Name ⬍</th>
          <th class="px-6 py-3 w-1/3 cursor-pointer" data-column="1">Position ⬍</th>
          <th class="px-6 py-3 w-1/3 cursor-pointer" data-column="2">Age ⬍</th>
        </tr>
      </thead>

      <!-- FIXED HEIGHT BODY -->
      <tbody
        id="tableBody"
        class="block min-h-[400px]"
      >
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Alice</td><td class="px-6 py-4">Developer</td><td class="px-6 py-4">24</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Bob</td><td class="px-6 py-4">Designer</td><td class="px-6 py-4">28</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Charlie</td><td class="px-6 py-4">Manager</td><td class="px-6 py-4">32</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Diana</td><td class="px-6 py-4">QA</td><td class="px-6 py-4">26</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Ethan</td><td class="px-6 py-4">Support</td><td class="px-6 py-4">30</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Fiona</td><td class="px-6 py-4">HR</td><td class="px-6 py-4">27</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">George</td><td class="px-6 py-4">CTO</td><td class="px-6 py-4">38</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Hannah</td><td class="px-6 py-4">Marketing</td><td class="px-6 py-4">25</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Ian</td><td class="px-6 py-4">Finance</td><td class="px-6 py-4">34</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Jane</td><td class="px-6 py-4">Recruiter</td><td class="px-6 py-4">29</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Karl</td><td class="px-6 py-4">DevOps</td><td class="px-6 py-4">31</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Laura</td><td class="px-6 py-4">UX Designer</td><td class="px-6 py-4">23</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Mike</td><td class="px-6 py-4">PM</td><td class="px-6 py-4">33</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Nina</td><td class="px-6 py-4">Analyst</td><td class="px-6 py-4">26</td></tr>
        <tr class="table w-full table-fixed"><td class="px-6 py-4">Oscar</td><td class="px-6 py-4">Intern</td><td class="px-6 py-4">22</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination (ALWAYS bottom) -->
  <div class="flex justify-between items-center p-4 border-t">
    <span id="pageInfo" class="text-sm text-gray-600"></span>
    <div class="space-x-2">
      <button id="prevBtn" class="px-3 py-1 border rounded">Prev</button>
      <button id="nextBtn" class="px-3 py-1 border rounded">Next</button>
    </div>
  </div>
</div>

<script>
  const rows = Array.from(document.querySelectorAll("#tableBody tr"));
  const searchInput = document.getElementById("searchInput");
  const rowsPerPage = 10;
  let currentPage = 1;
  let sortDir = true;

  function render() {
    const query = searchInput.value.toLowerCase();
    const filtered = rows.filter(r =>
      r.innerText.toLowerCase().includes(query)
    );

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;

    rows.forEach(r => r.style.display = "none");
    filtered.slice(start, end).forEach(r => r.style.display = "table");

    const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
    currentPage = Math.min(currentPage, totalPages);

    document.getElementById("pageInfo").textContent =
      `Page ${currentPage} of ${totalPages}`;
  }

  searchInput.addEventListener("input", () => {
    currentPage = 1;
    render();
  });

  document.querySelectorAll("th[data-column]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.column;
      rows.sort((a, b) => {
        const A = a.children[col].innerText;
        const B = b.children[col].innerText;
        return sortDir
          ? A.localeCompare(B, undefined, { numeric: true })
          : B.localeCompare(A, undefined, { numeric: true });
      });
      sortDir = !sortDir;
      rows.forEach(r => tableBody.appendChild(r));
      render();
    });
  });

  document.getElementById("prevBtn").onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      render();
    }
  };

  document.getElementById("nextBtn").onclick = () => {
    currentPage++;
    render();
  };

  render();
</script>

</body>
</html>
