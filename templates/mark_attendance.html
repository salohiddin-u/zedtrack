<!DOCTYPE html>
{% load static %}
<html lang="en">
   <head>
      <script>
         (() => {
           try {
             const theme = localStorage.getItem('color-theme');
             const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
             const useDark = theme === 'dark' || (!theme && prefersDark);

             if (useDark) {
               document.documentElement.classList.add('dark');
             } else {
               document.documentElement.classList.remove('dark');
             }

             // Optional: prevent flicker by hiding body until CSS applies
             document.documentElement.style.visibility = 'hidden';
             window.addEventListener('DOMContentLoaded', () => {
               document.documentElement.style.visibility = '';
             });
           } catch (e) {}
         })();
      </script>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Marking Attendance | ZEDTRACK</title>
      <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>
      <!-- Flowbite CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
      <!-- Static Tailwind CSS (works with dark mode via .dark class) -->
      <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.13/dist/tailwind.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
      <link rel="shortcut icon" href="{% static 'logo.png' %}"
         type="image/x-icon"/>
      <style>
         /* smooth horizontal sweep behind item */
         @keyframes sweep {
         0%   { background-position: 0% 50%; }
         50%  { background-position: 100% 50%; }
         100% { background-position: 0% 50%; }
         }
         .animate-sweep {
         background-size: 200% 200%;
         animation: sweep 3s ease-in-out infinite;
         }
         /* moving gradient text for "AI" */
         @keyframes textflow {
         0%   { background-position: 0% 50%; }
         50%  { background-position: 100% 50%; }
         100% { background-position: 0% 50%; }
         }
         .animate-textflow {
         background-size: 200% auto;
         animation: textflow 3s linear infinite;
         }
      </style>
      <style>
         html, body {
         height: 100%;
         margin: 0;
         padding: 0;
         }
         body {
         background-color: rgb(243 244 246); /* Tailwind gray-100 */
         }
         .dark body {
         background-color: rgb(17 24 39); /* Tailwind gray-900 */
         }
         .antialiased {
         min-height: 100vh;
         }
      </style>
   </head>
   <body>
      <div class="antialiased bg-gray-100 dark:bg-gray-900">
         <nav class="bg-white border-b border-gray-200 px-4 py-2.5 dark:bg-gray-800 dark:border-gray-700 fixed left-0 right-0 top-0 z-50">
            <div class="flex flex-wrap justify-between items-center">
               <div class="flex justify-start items-center">
                  <button
                     data-drawer-target="drawer-navigation"
                     data-drawer-toggle="drawer-navigation"
                     aria-controls="drawer-navigation"
                     class="p-2 mr-2 text-gray-600 rounded-lg cursor-pointer md:hidden hover:text-gray-900 hover:bg-gray-100 focus:bg-gray-100 dark:focus:bg-gray-700 focus:ring-2 focus:ring-gray-100 dark:focus:ring-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                     >
                     <svg
                        aria-hidden="true"
                        class="w-6 h-6"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg"

                        <path
                           fill-rule="evenodd"

                        xmlns="http://www.w3.org/2000/svg"

                        <path

                     </svg>
                     <span class="sr-only">Toggle sidebar</span>
                  </button>
                  <a href="{% url 'dashboard' %}" class="flex items-center justify-between mr-4">
                  <img style="border-radius: 8px;"
                     src="{% static 'logo.png' %}"

               <div class="flex items-center lg:order-2">
                  <!-- Theme toggle button (place beside profile button) -->
                  <button id="theme-toggle" type="button" class="p-2 ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                     <!-- Sun (light) -->

                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                     </svg>
                     <!-- Moon (dark) -->
                     <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd" d="M17.293 13.293a8 8 0 11-10.586-10.586 8.001 8.001 0 0010.586 10.586z" clip-rule="evenodd"/>
                     </svg>
                  </button>
                  <button id="fullscreen-btn" class="p-2 ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                  <i class="fas fa-expand"></i>
                  </button>
                  <button
                     type="button"
                     class="flex mx-3 text-sm bg-gray-800 rounded-full md:mr-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
                     id="user-menu-button"
                     aria-expanded="false"
                     data-dropdown-toggle="dropdown"
                     >
                  <img
                     class="w-8 h-8 rounded-full"
                     src="{% static 'profile.png' %}"
                     alt="user photo"
                     />
                  </button>
                  <!-- Dropdown menu -->
                  <div
                     class="hidden z-50 my-4 w-56 text-base list-none bg-white rounded divide-y divide-gray-100 shadow dark:bg-gray-700 dark:divide-gray-600 rounded-xl"
                     id="dropdown"
                     >
                     <div class="py-3 px-4">
                        <span
                           class="block text-sm font-semibold text-gray-900 dark:text-white"
                           >Neil Sims</span
                           >
                        <span
                           class="block text-sm text-gray-900 truncate dark:text-white"
                           >name@example.com</span
                           >
                     </div>
                     <ul
                        class="py-1 text-gray-700 dark:text-gray-300"
                        aria-labelledby="dropdown"
                        >
                        <li>
                           <a
                              href="#"
                              class="block py-2 px-4 text-sm hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
                              >Sign out</a
                              >
                        </li>
                     </ul>
                  </div>
               </div>
            </div>
         </nav>
         <!-- Sidebar -->
         <aside
            class="fixed top-0 left-0 z-40 w-64 h-screen pt-14 transition-transform -translate-x-full bg-white border-r border-gray-200 md:translate-x-0 dark:bg-gray-800 dark:border-gray-700"
            aria-label="Sidenav"
            id="drawer-navigation"
            >
            <div class="overflow-y-auto py-5 px-3 h-full bg-white dark:bg-gray-800">
               <ul class="space-y-2">
                  <li>
                     <a
                        href="{% url 'dashboard' %}"
                        class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                           <path fill="#1d4ed8" d="M10.995 4.68v3.88A2.44 2.44 0 0 1 8.545 11h-3.86a2.38 2.38 0 0 1-1.72-.72a2.41 2.41 0 0 1-.71-1.72V4.69a2.44 2.44 0 0 1 2.43-2.44h3.87a2.42 2.42 0 0 1 1.72.72a2.39 2.39 0 0 1 .72 1.71m10.75.01v3.87a2.46 2.46 0 0 1-2.43 2.44h-3.88a2.5 2.5 0 0 1-1.73-.71a2.44 2.44 0 0 1-.71-1.73V4.69a2.39 2.39 0 0 1 .72-1.72a2.42 2.42 0 0 1 1.72-.72h3.87a2.46 2.46 0 0 1 2.44 2.44m0 10.75v3.87a2.46 2.46 0 0 1-2.43 2.44h-3.88a2.5 2.5 0 0 1-1.75-.69a2.42 2.42 0 0 1-.71-1.73v-3.87a2.391 2.391 0 0 1 .72-1.72a2.421 2.421 0 0 1 1.72-.72h3.87a2.46 2.46 0 0 1 2.44 2.44zm-10.75.01v3.87a2.46 2.46 0 0 1-2.45 2.43h-3.86a2.42 2.42 0 0 1-2.43-2.43v-3.87A2.46 2.46 0 0 1 4.685 13h3.87a2.49 2.49 0 0 1 1.73.72a2.45 2.45 0 0 1 .71 1.73"/>
                        </svg>
                        <span class="ml-3">Dashboard</span>
                     </a>
                  </li>
                  <li>
                     <a
                        href="{% url 'marking-attendance' %}"
                        class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg group bg-blue-200"
                        >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                           <path fill="#1d4ed8" d="M23 12c0 6.075-4.925 11-11 11S1 18.075 1 12S5.925 1 12 1s11 4.925 11 11M9.305 18.11l9.402-9.403l-1.414-1.414l-7.883 7.883l-2.476-3.01l-1.511 1.31l3.882 4.633z"/>
                        </svg>
                        <span class="ml-3">Marking Attendance</span>
                     </a>
                  </li>

                  <!-- ... (your sidebar stays exactly the same) ... -->

               </ul>
            </div>
         </aside>

         <main class="p-4 md:ml-64 pt-20 h-[calc(100vh-2px)] font-sans">
            <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 flex flex-col min-h-[90vh]">

               <!-- ✅ Search (aligned with table padding; no weird left space) -->
               <div class="px-6 py-4">
                  <input
                     id="searchInput"
                     type="text"
                     placeholder="Search..."
                     class="w-full md:w-80 p-2 border rounded-lg"
                     />
               </div>

               <!-- Table -->
               <form id="attendanceForm">
                  <div class="overflow-x-auto rounded-lg">
                     <table class="w-full text-sm text-left text-gray-600">
                        <thead class="bg-blue-200 text-xs uppercase">
                           <tr>
                              <th class="px-6 py-3 cursor-pointer" data-column="0">Name ⬍</th>
                              <th class="px-6 py-3 cursor-pointer" data-column="0"></th>
                              <th class="px-6 py-3 cursor-pointer" data-column="2">Status ⬍</th>
                           </tr>
                        </thead>
                        <tbody id="tableBody">
                           <!-- HTML DATA -->
                           {% for student in students %}
                           <tr onclick="toggleCheckbox(event, this)" class="cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-600">
                              <td class="px-6 py-4 font-bold dark:text-gray-50">{{ student.first_name }} {{ student.last_name }}</td>
                              <td class="px-6 py-4 font-bold"></td>
                              <td class="px-6 py-4">
                                 <div class="flex items-center">
                                    <input
                                       id="checkbox-{{ student.id }}"
                                       type="checkbox"
                                       class="attendance-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                    <label for="checkbox-{{ student.id }}" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Present</label>
                                 </div>
                              </td>
                           </tr>
                           {% endfor %}
                        </tbody>
                     </table>
                  </div>

               </form>

               <!-- Pagination -->
               <div class="flex justify-between items-center p-4 border-t">
                  <span id="pageInfo" class="text-sm text-gray-600 dark:text-gray-50"></span>
                  <div class="space-x-2">
                     <button id="prevBtn" class="px-3 py-1 border rounded dark:text-gray-50">Prev</button>
                     <button id="nextBtn" class="px-3 py-1 border rounded dark:text-gray-50">Next</button>
                  </div>
               </div>

               <!-- ✅ Sticky action bar (Submit near the end = better UX) -->
               <div class="sticky bottom-0 bg-white dark:bg-gray-800 border-t px-6 py-3 flex items-center justify-between">
                  <span id="selectedCount" class="text-sm text-gray-600 dark:text-gray-300">
                     Selected: 0 students
                  </span>

                  <button
                     type="submit"
                     form="attendanceForm"
                     id="submitAttendance"
                     disabled
                     class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium px-5 py-2 rounded-lg transition duration-300"
                     >
                     Submit Attendance
                  </button>
               </div>

            </div>
         </main>
      </div>

      <script>
         const allRows = Array.from(document.querySelectorAll("#tableBody tr"));
         const searchInput = document.getElementById("searchInput");
         const rowsPerPage = 10;

         let currentPage = 1;
         let sortDir = true;

         function render() {
           const query = searchInput.value.toLowerCase();
           const filtered = allRows.filter(row =>
             row.innerText.toLowerCase().includes(query)
           );

           const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
           currentPage = Math.min(currentPage, totalPages);

           const start = (currentPage - 1) * rowsPerPage;
           const pageRows = filtered.slice(start, start + rowsPerPage);

           const tbody = document.getElementById("tableBody");
           tbody.innerHTML = "";

           // Render real rows
           pageRows.forEach(row => tbody.appendChild(row));

           // 🔑 Fill empty rows to keep height constant
           for (let i = pageRows.length; i < rowsPerPage; i++) {
             const emptyRow = document.createElement("tr");
             emptyRow.innerHTML = `
               <td class="px-6 py-4">&nbsp;</td>
               <td class="px-6 py-4"></td>
               <td class="px-6 py-4"></td>
             `;
             tbody.appendChild(emptyRow);
           }

           document.getElementById("pageInfo").textContent =
             `Page ${currentPage} of ${totalPages}`;

           // Update selection info after re-render (safe)
           updateSelection();
         }

         searchInput.addEventListener("input", () => {
           currentPage = 1;
           render();
         });

         document.querySelectorAll("th[data-column]").forEach(th => {
           th.addEventListener("click", () => {
             const col = th.dataset.column;
             allRows.sort((a, b) => {
               const A = a.children[col].innerText;
               const B = b.children[col].innerText;
               return sortDir
                 ? A.localeCompare(B, undefined, { numeric: true })
                 : B.localeCompare(A, undefined, { numeric: true });
             });
             sortDir = !sortDir;
             render();
           });
         });

         document.getElementById("prevBtn").onclick = (e) => {
           e.preventDefault();
           if (currentPage > 1) currentPage--;
           render();
         };

         document.getElementById("nextBtn").onclick = (e) => {
           e.preventDefault();
           currentPage++;
           render();
         };

         render();
      </script>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
      <script>
         tailwind = window.tailwind || {};
         tailwind.config = tailwind.config || {};
         tailwind.config.darkMode = 'class';
      </script>
      <script>
         tailwind.config = { darkMode: 'class' };
      </script>
      <script>
         document.addEventListener('DOMContentLoaded', () => {
           const btn = document.getElementById('theme-toggle');
           const darkIcon = document.getElementById('theme-toggle-dark-icon');
           const lightIcon = document.getElementById('theme-toggle-light-icon');

           // Set initial theme
           const storedTheme = localStorage.getItem('color-theme');
           if (storedTheme === 'dark') {
             document.documentElement.classList.add('dark');
             darkIcon.classList.add('hidden');
             lightIcon.classList.remove('hidden');
           } else {
             document.documentElement.classList.remove('dark');
             lightIcon.classList.add('hidden');
             darkIcon.classList.remove('hidden');
           }

           // Toggle theme on click
           btn.addEventListener('click', () => {
             document.documentElement.classList.toggle('dark');
             const isDark = document.documentElement.classList.contains('dark');
             localStorage.setItem('color-theme', isDark ? 'dark' : 'light');

             darkIcon.classList.toggle('hidden', isDark);
             lightIcon.classList.toggle('hidden', !isDark);
           });
         });
      </script>
      <script>
         const btn = document.getElementById('fullscreen-btn');
         const icon = btn.querySelector('i');

         btn.addEventListener('click', () => {
           if (!document.fullscreenElement) {
             document.documentElement.requestFullscreen();
             icon.classList.replace('fa-expand', 'fa-compress');
           } else {
             document.exitFullscreen();
             icon.classList.replace('fa-compress', 'fa-expand');
           }
         });
      </script>

      <!-- ✅ Selection counter + safer row toggle -->
      <script>
         const selectedCountEl = document.getElementById('selectedCount');
         const submitBtn = document.getElementById('submitAttendance');

         function updateSelection() {
           const checked = document.querySelectorAll('.attendance-checkbox:checked').length;
           if (selectedCountEl) selectedCountEl.textContent = `Selected: ${checked} students`;
           if (submitBtn) submitBtn.disabled = checked === 0;
         }

         // Update when user directly checks/unchecks
         document.addEventListener('change', (e) => {
           if (e.target && e.target.classList && e.target.classList.contains('attendance-checkbox')) {
             updateSelection();
           }
         });

         function toggleCheckbox(e, row) {
           // If user clicked checkbox/label, don't double-toggle
           if (e && e.target && e.target.closest('input, label')) return;

           const checkbox = row.querySelector('.attendance-checkbox');
           if (checkbox) {
             checkbox.checked = !checkbox.checked;
             updateSelection();
           }
         }

         // Initial state
         updateSelection();
      </script>

   </body>
</html>
