<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite CSS -->
  <link href="https://unpkg.com/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Reset Your Password
    </h2>

    <p class="text-gray-600 text-sm mb-6 text-center">
      Enter your email address and we’ll send you a link to reset your password.
    </p>

    <!-- Allauth Password Reset Form -->
    <form method="POST" action="{% url 'account_reset_password' %}" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div>
        <label for="id_email" class="block text-sm font-medium text-gray-700">
          Email Address
        </label>
        <input
          type="email"
          name="email"
          id="id_email"

          required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500"
        />
        {{ form.email.errors }}
      </div>

      <button
        type="submit"
        class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5"
      >
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      <a href="{% url 'account_login' %}" class="text-blue-600 hover:underline">
        Back to Login
      </a>
    </p>

  </div>

  <!-- Flowbite JS -->
  <script src="https://unpkg.com/flowbite@2.3.0/dist/flowbite.min.js"></script>
</body>
</html>
