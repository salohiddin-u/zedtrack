<!DOCTYPE html>
{% load socialaccount %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite CSS -->
  <link href="https://unpkg.com/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet" />

  <!-- Flowbite JS -->
  <script src="https://unpkg.com/flowbite@2.3.0/dist/flowbite.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Set New Password</h2>



    <form method="POST">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-4">
        <label for="id_password1" class="block text-sm font-medium text-gray-700">New Password</label>
        <input type="password" id="id_password1" name="password1" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">

      </div>
      <div class="mb-4">
        <label for="id_password2" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" id="id_password2" name="password2" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">

      </div>
      <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-md font-medium">
        Set New Password
      </button>
    </form>
  </div>
</body>
</html>
